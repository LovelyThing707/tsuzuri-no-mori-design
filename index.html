<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>綴りの森</title>
<meta name="description" content="本を選ぶ楽しみをそのままに。オンライン書店「綴りの森」">
<meta name="theme-color" content="#1C2620">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/hero.css">
<link rel="stylesheet" href="styles/shelf.css">
</head>
<body>
<div class="page">

<header class="hero">
  <div class="hero__scene">
    <picture>
      <source media="(min-width:768px)" srcset="assets/images/hero-forest-landscape.webp">
      <img src="assets/images/hero-forest-portrait.webp" alt=""
           fetchpriority="high" decoding="async">
    </picture>
  </div>
  <div class="hero__light"></div>
  <div class="hero__veil"></div>

  <div class="hero__title">
    <h1 class="hero__name">綴りの森</h1>
    <p class="hero__lead">本を選ぶ楽しみをそのままに―</p>
  </div>

  <a class="hero__scroll" href="#theme-1">
    <span>棚をのぞく</span>
    <svg viewBox="0 0 13 20" aria-hidden="true">
      <path class="hero__arrow" d="M6.5 1 V17 M1.5 12 L6.5 17.4 L11.5 12"/>
    </svg>
  </a>
</header>

<section class="threshold">
  <p>森のおくに、<br>小さな本屋があります。</p>
</section>

<main class="room">

  <section class="market" aria-labelledby="theme-1">
    <div class="wrap">
      <h2 class="market__sign" id="theme-1">子供に読みたい本</h2>
    </div>
    <div class="scene">
      <div class="scene__floor"></div>
      <div class="wrap">
        <p class="sr-only">本棚に背表紙が2段、手前の平台に表紙を上にした本が並びます。</p>
        <div class="shelf" aria-hidden="true">
        <div class="shelf__tier">
          <ul class="row">
        <li class="spine spine--plain" style="--h:188;--t:21;--c:#7A6A52;--e:#DED3BC"></li>
        <li class="spine" style="--h:210;--t:16;--c:#6F2027;--e:#ECE3D2"><img src="assets/images/spine-aya-to-majo.webp" alt="" loading="lazy" decoding="async"></li>
        <li class="spine spine--plain" style="--h:148;--t:12;--c:#B5A58A;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:257;--t:28;--c:#4A5D52;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:182;--t:15;--c:#241A14;--e:#DED3BC"></li>
        <li class="spine" style="--h:201;--t:25;--c:#F0EEE9;--e:#F4F1E9"><img src="assets/images/spine-kagaku-no-ohanashi-25.webp" alt="" loading="lazy" decoding="async"></li>
        <li class="spine spine--plain" style="--h:210;--t:33;--c:#8A4B3C;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:148;--t:9;--c:#D8CDB5;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:218;--t:24;--c:#3C4A5E;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:182;--t:17;--c:#94795A;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:188;--t:13;--c:#2F3B33;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:210;--t:26;--c:#6E2F38;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:173;--t:10;--c:#A8654A;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:257;--t:30;--c:#55402E;--e:#DED3BC"></li>
          </ul>
          <div class="shelf__board"></div>
        </div>
        <div class="shelf__tier">
          <ul class="row">
        <li class="spine spine--plain" style="--h:210;--t:18;--c:#3A3F4A;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:148;--t:11;--c:#C4B79A;--e:#DED3BC"></li>
        <li class="spine" style="--h:148;--t:19;--c:#A9CDDB;--e:#E7DCC4"><img src="assets/images/spine-monteleggio.webp" alt="" loading="lazy" decoding="async"></li>
        <li class="spine spine--plain" style="--h:218;--t:31;--c:#5E4B36;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:182;--t:14;--c:#6B5B7A;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:188;--t:23;--c:#8F6A45;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:148;--t:8;--c:#241A14;--e:#DED3BC"></li>
        <li class="spine" style="--h:260;--t:11;--c:#A9CDDC;--e:#F1EBDE"><img src="assets/images/spine-suika-no-pool.webp" alt="" loading="lazy" decoding="async"></li>
        <li class="spine spine--plain" style="--h:210;--t:20;--c:#46543F;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:257;--t:27;--c:#7C4230;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:173;--t:16;--c:#B0A184;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:182;--t:12;--c:#333A44;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:188;--t:29;--c:#6A5340;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:210;--t:15;--c:#9A8258;--e:#DED3BC"></li>
          </ul>
          <div class="shelf__board"></div>
        </div>
        </div>
        <div class="platform" aria-hidden="true">
          <ul class="platform__books">
        <li class="lying" style="--h:260;--w:191;--c:#A9CDDC;--e:#F1EBDE;--rot:-2.4deg"><img src="assets/images/cover-suika-no-pool.webp" alt="" loading="lazy" decoding="async"></li>
        <li class="lying" style="--h:201;--w:144;--c:#F0EEE9;--e:#F4F1E9;--rot:1.6deg"><img src="assets/images/cover-kagaku-no-ohanashi-25.webp" alt="" loading="lazy" decoding="async"></li>
        <li class="lying" style="--h:210;--w:152;--c:#6F2027;--e:#ECE3D2;--rot:-1.1deg"><img src="assets/images/cover-aya-to-majo.webp" alt="" loading="lazy" decoding="async"></li>
        <li class="lying" style="--h:188;--w:128;--c:#6B5B48;--e:#E2D8C2;--rot:2.2deg"></li>
        <li class="lying" style="--h:210;--w:148;--c:#3E4C43;--e:#DED3BC;--rot:-1.8deg"></li>
        <li class="lying" style="--h:148;--w:105;--c:#9A7F5C;--e:#E7DCC4;--rot:1.2deg"></li>
          </ul>
          <div class="platform__slab"></div>
        </div>
      </div>
    </div>
  </section>

  <div class="aisle">
    <div class="aisle__light"></div>
    <div class="wrap">
      <div class="aisle__inner">
        <div class="window"></div>
        <div class="sill"></div>
        <img class="plant" src="assets/images/plant.webp" alt=""
             loading="lazy" decoding="async">
      </div>
    </div>
  </div>


  <section class="market" aria-labelledby="theme-2">
    <div class="wrap">
      <h2 class="market__sign" id="theme-2">夜に読む本</h2>
    </div>
    <div class="scene">
      <div class="scene__floor"></div>
      <div class="wrap">
        <p class="sr-only">本棚に背表紙が1段、手前の平台に表紙を上にした本が並びます。</p>
        <div class="shelf" aria-hidden="true">
        <div class="shelf__tier">
          <ul class="row">
        <li class="spine spine--plain" style="--h:182;--t:16;--c:#2B3340;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:148;--t:10;--c:#A99878;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:210;--t:24;--c:#4B3A5C;--e:#DED3BC"></li>
        <li class="spine" style="--h:210;--t:16;--c:#6F2027;--e:#ECE3D2"><img src="assets/images/spine-aya-to-majo.webp" alt="" loading="lazy" decoding="async"></li>
        <li class="spine spine--plain" style="--h:188;--t:19;--c:#1F2A22;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:257;--t:32;--c:#5A4130;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:173;--t:13;--c:#C9BBA0;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:210;--t:22;--c:#3F4A57;--e:#DED3BC"></li>
        <li class="spine" style="--h:148;--t:19;--c:#A9CDDB;--e:#E7DCC4"><img src="assets/images/spine-monteleggio.webp" alt="" loading="lazy" decoding="async"></li>
        <li class="spine spine--plain" style="--h:218;--t:26;--c:#70503A;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:182;--t:11;--c:#241A14;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:188;--t:28;--c:#87614C;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:148;--t:14;--c:#8E9A8C;--e:#DED3BC"></li>
        <li class="spine spine--plain" style="--h:210;--t:17;--c:#5C4658;--e:#DED3BC"></li>
          </ul>
          <div class="shelf__board"></div>
        </div>
        </div>
        <div class="platform" aria-hidden="true">
          <ul class="platform__books">
        <li class="lying" style="--h:148;--w:105;--c:#A9CDDB;--e:#E7DCC4;--rot:-1.9deg"><img src="assets/images/cover-monteleggio.webp" alt="" loading="lazy" decoding="async"></li>
        <li class="lying" style="--h:210;--w:152;--c:#2E2A38;--e:#DCD1B8;--rot:1.5deg"></li>
        <li class="lying" style="--h:182;--w:128;--c:#7A4A3E;--e:#E2D8C2;--rot:-2.1deg"></li>
        <li class="lying" style="--h:257;--w:182;--c:#4A5546;--e:#E9E0CE;--rot:1.9deg"></li>
        <li class="lying" style="--h:188;--w:130;--c:#8B7350;--e:#DED3BC;--rot:-1.3deg"></li>
        <li class="lying" style="--h:148;--w:105;--c:#514257;--e:#E7DCC4;--rot:2.4deg"></li>
          </ul>
          <div class="platform__slab"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap">
    <p class="foot__name">綴りの森</p>
    <nav class="foot__links" aria-label="サイト内の案内">
      <a href="#">綴りの森について</a>
      <a href="#">お問い合わせ</a>
      <a href="#">特定商取引法に基づく表記</a>
      <a href="#">プライバシーポリシー</a>
    </nav>
  </div>
</footer>

</div>
<script src="scripts/main.js"></script>
</body>
</html>
